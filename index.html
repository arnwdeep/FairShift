<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23D9381E'><circle cx='12' cy='12' r='10'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FairShift — Decent Work Platform (UN SDG 8)</title>
    <!-- Google Fonts: Space Mono, Silkscreen (Dot Matrix), Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              mono: ['"Space Mono"', 'monospace'],
              ndot: ['"Silkscreen"', 'monospace'],
            },
            colors: {
              cmf: {
                orange: '#D9381E',
                darkOrange: '#B52810',
                lightOrange: '#FF4D2D',
                bone: '#F4F4F2',
                card: '#FFFFFF',
                black: '#111111',
                dark: '#1C1C1E',
                grey: '#767676',
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #ECECE9;
        color: #111111;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: #ECECE9;
      }
      ::-webkit-scrollbar-thumb {
        background: #C4C4C0;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #999995;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
